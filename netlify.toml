[functions]

  [functions.emails]
  included_files = [
    "./emails/**"
  ]

[build]
functions = "netlify/functions"
publish = "."

[[redirects]]
from = "/forms/*"
to = "/404.html"
status = 404

[context]

  [context.production]

    [context.production.functions]

      [context.production.functions.emails]
      included_files = [
        "./emails/**"
      ]

  [context.master]

    [context.master.functions]

      [context.master.functions.emails]
      included_files = [
        "./emails/**"
      ]